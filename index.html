<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MindMap Dashboard</title>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --text-light: #64748b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 2rem; color: #4338ca; display: flex; align-items: center; gap: 10px; }
        .tag { background: #e0e7ff; color: #4338ca; font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; font-weight: bold; vertical-align: middle; }
        .create-bar { background: var(--surface); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; gap: 15px; margin-bottom: 40px; align-items: flex-end; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--text-light); }
        input { padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 1rem; outline: none; transition: border 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        button.primary { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        button.primary:hover { background: #4f46e5; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--surface); padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; cursor: pointer; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-color: #cbd5e1; }
        .icon-box { width: 48px; height: 48px; background: #e0e7ff; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 15px; }
        .card h3 { margin: 0 0 5px 0; font-size: 1.25rem; }
        .card p { margin: 0; font-size: 0.85rem; color: var(--text-light); }
        .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 1.2rem; transition: color 0.2s; }
        .delete-btn:hover { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span>MindMap Pro</span> <span class="tag">OFFLINE</span></h1>
        <div class="create-bar">
            <div class="input-group">
                <label>New Project Name</label>
                <input type="text" id="new-project-name" placeholder="e.g. Marketing Strategy 2025">
            </div>
            <button id="create-btn" class="primary">+ Create Project</button>
        </div>
        <div id="project-list" class="grid"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
